<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .input-group { margin-bottom: 10px; }
        input { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; background: #ff4d4d; color: white; border: none; border-radius: 4px; }
        button:hover { background: #e64545; }
        .restaurant-item { background: #f4f4f4; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .status-tag { font-size: 0.8em; padding: 2px 6px; border-radius: 4px; }
        .enabled { background: #dcfce7; color: #166534; }
        .disabled { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<h2>Admin Panel</h2>

<div id="login-box">
    <h3>Login</h3>
    <input id="u" placeholder="Admin Username">
    <input id="p" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<hr>

<div id="panel" style="display:none;">
    <h3>Add New Restaurant</h3>
    <div class="input-group"><input id="rname" placeholder="Restaurant Name"></div>
    <div class="input-group"><input id="ruser" placeholder="Username"></div>
    <div class="input-group"><input id="rpass" placeholder="Password"></div>
    <div class="input-group"><input id="rlat" placeholder="Latitude"></div>
    <div class="input-group"><input id="rlng" placeholder="Longitude"></div>
    <div class="input-group"><input id="rwhatsapp" placeholder="WhatsApp Number (e.g. 9198...)"></div>
    <div class="input-group"><input id="rcuisines" placeholder="Cuisines (e.g. South Indian, Dosa)"></div>
    <div class="input-group"><input id="rsheet" placeholder="Google Sheet URL"></div>
    <button onclick="addRestaurant()">Add Restaurant</button>

    <hr>
    <h3>Existing Restaurants</h3>
    <div id="restaurants"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw-LmdGMwxHNBoRL_Zpvgzag7GkboaetJy8i5NmePCIphxIzOH7Wk1OFWXaxWnLuoVZ/exec";

function login() {
    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "adminLogin",
            username: document.getElementById("u").value.trim(),
            password: document.getElementById("p").value.trim()
        })
    })
    .then(res => res.json())
    .then(d => {
        if (!d.success) {
            alert("Invalid admin credentials");
            return;
        }
        document.getElementById("login-box").style.display = "none";
        document.getElementById("panel").style.display = "block";
        loadRestaurants();
    })
    .catch(err => {
        console.error(err);
        alert("Server error");
    });
}

function loadRestaurants() {
    fetch(API, {
        method: "POST",
        body: JSON.stringify({ action: "getAllRestaurants" })
    })
    .then(r => r.json())
    .then(restaurants => {
        const container = document.getElementById("restaurants");
        container.innerHTML = "";
        restaurants.forEach(r => {
            // r[0]: ID, r[1]: Name, r[6]: Enabled Status (YES/NO), r[7]: Order Sheet ID
            const isEnabled = r[6] === "YES";
            container.innerHTML += `
                <div class="restaurant-item">
                    <div>
                        <strong>${r[1]}</strong> 
                        <span class="status-tag ${isEnabled ? 'enabled' : 'disabled'}">${isEnabled ? 'Active' : 'Disabled'}</span>
                        <br><small>${r[7] ? "✅ Sheet Linked" : "⚠️ No Sheet"}</small>
                    </div>
                    <div>
                        <button style="background:#22c55e" onclick="toggleRestaurant('${r[0]}', 'YES')">Enable</button>
                        <button style="background:#64748b" onclick="toggleRestaurant('${r[0]}', 'NO')">Disable</button>
                    </div>
                </div>
            `;
        });
    });
}

function toggleRestaurant(id, e) {
    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "toggleRestaurant",
            restaurant_id: id,
            enabled: e
        })
    }).then(loadRestaurants);
}

function addRestaurant() {
    const name = document.getElementById("rname").value.trim();
    const username = document.getElementById("ruser").value.trim();
    const password = document.getElementById("rpass").value.trim();
    const lat = document.getElementById("rlat").value.trim();
    const lng = document.getElementById("rlng").value.trim();
    const whatsapp = document.getElementById("rwhatsapp").value.trim();
    const cuisines = document.getElementById("rcuisines").value.trim();
    const sheet_url = document.getElementById("rsheet").value.trim();

    if (!name || !username || !password || !lat || !lng || !whatsapp || !cuisines || !sheet_url) {
        return alert("Please fill all fields, including WhatsApp and Cuisines!");
    }

    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "addRestaurant",
            name,
            username,
            password,
            lat,
            lng,
            whatsapp,
            cuisines,
            sheet_url
        })
    })
    .then(r => r.json())
    .then(d => {
        if(d.success){
            alert("Restaurant added successfully!");
            loadRestaurants();
            // Clear all fields
            ["rname", "ruser", "rpass", "rlat", "rlng", "rwhatsapp", "rcuisines", "rsheet"].forEach(id => {
                document.getElementById(id).value = "";
            });
        } else {
            alert(d.message || "Failed to add restaurant");
        }
    });
}
</script>

</body>
</html>
