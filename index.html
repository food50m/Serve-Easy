<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food 50m - Nearby Bites</title>

  <style>
    /* Modern Variable-based Styling */
    :root {
      --primary: #ff4d4d;
      --primary-dark: #e63946;
      --bg: #f8fafc;
      --text: #1e293b;
      --text-light: #64748b;
      --white: #ffffff;
      --shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Modern Sticky Header */
    header {
      background: var(--primary);
      color: var(--white);
      padding: 1.25rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(255, 77, 77, 0.3);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    #loc-status {
      display: block;
      font-size: 10px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 4px;
    }

    .container {
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
      min-height: 80vh;
    }

    /* Search Container */
    .search-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-box {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border-radius: 16px;
      border: 2px solid transparent;
      background: var(--white);
      box-shadow: var(--shadow);
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 77, 77, 0.1);
    }

    /* Restaurant Cards */
    .restaurant {
      background: var(--white);
      border-radius: 20px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .restaurant:active {
      transform: scale(0.97);
      background: #fffafa;
    }

    .restaurant-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .distance-tag {
      display: inline-flex;
      align-items: center;
      background: #fee2e2;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
    }

    /* Payment Dropdown Styling */
    select#pay_mode {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1em;
    }

    .footer-version {
      text-align: center;
      font-size: 10px;
      color: var(--text-light);
      padding: 30px 10px;
      opacity: 0.6;
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
    }
  </style>
</head>

<body>

  <header>
    <h1>Food 50m</h1>
    <small id="loc-status">Detecting location...</small>
  </header>

  <div class="container">
    <div class="search-container">
      <button onclick="filterRestaurants()" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; z-index: 10;">🔍</button>
      
      <input
        id="search"
        class="search-box"
        placeholder="Order ahead? Search by name..."
        oninput="filterRestaurants()"
        autocomplete="off"
      />
    </div>

    <div id="out">
      </div>

    <div class="footer-version">
      App Version 1.1.2 (Live Update) | Local Pilot Mode
    </div>
  </div>

  <script src="app.js?v=1.1.2"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      // Note: During active development/pilot, Service Workers can cause 
      // aggressive caching. Only enable if your service-worker.js is ready.
      // navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
